[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-knowledge-assistant"
version = "0.1.0"
description = "Transparent enterprise multi-agent RAG assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "langgraph>=1.0.10,<2",
  "langchain-openai>=1.1.14,<2",
  "langsmith>=0.1,<1",
  "pinecone>=5,<8",
  "rank-bm25>=0.2.2,<1",
  "httpx>=0.27,<1",
  "streamlit>=1.39,<2",
  "sse-starlette>=2.1,<3",
  "mcp>=1.0,<2",
  "structlog>=24.4,<26",
  "aiosqlite>=0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.7,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
