services:
  volume-init:
    build: .
    user: "0:0"
    command: ["sh", "-c", "chown -R app:app /workspace/data/runtime"]
    volumes: ["conversation_data:/workspace/data/runtime"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    restart: "no"
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["conversation_data:/workspace/data/runtime"]
    depends_on:
      volume-init: {condition: service_completed_successfully}
    # Immutable root filesystems limit persistence after a container compromise.
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  ui:
    build: .
    env_file: .env
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.address=0.0.0.0"]
    volumes: ["./ui:/workspace/ui"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    ports: ["8501:8501"]
    depends_on:
      api: {condition: service_healthy}
  mcp:
    build: .
    command: ["python", "-m", "app.mcp_server"]
    environment: ["MCP_BIND_HOST=0.0.0.0"]
    # Expose MCP only to the Compose network; no host port is published.
    expose: ["8010"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]

volumes:
  conversation_data:
